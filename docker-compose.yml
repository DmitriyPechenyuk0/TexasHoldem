# Local backing services. Ports bind to 127.0.0.1 only; override any of them via a root .env file.
name: holdem

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: holdem
      POSTGRES_PASSWORD: holdem
      POSTGRES_DB: holdem
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory, so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdem -d holdem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: holdem
      RUSTFS_SECRET_KEY: holdem-dev-secret
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot bucket setup, run by `pnpm infra:up` after the services are healthy.
  s3-init:
    image: amazon/aws-cli:2.38.5
    profiles: ["init"]
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: holdem
      AWS_SECRET_ACCESS_KEY: holdem-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./infra/s3:/init:ro

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
  s3-data:
