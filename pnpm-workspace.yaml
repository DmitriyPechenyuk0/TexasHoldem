packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false

# Security fixes Nest has not shipped yet. Drop each once its parent depends on a fixed version.
overrides:
  # @nestjs/platform-express 12.2.0 pins multer 2.4.0: GHSA-q7qp-rjg7-q26m (DoS), fixed in 2.5.0.
  multer@2.4.0: 2.5.0

# Known advisories with no fix to take, checked and accepted. `pnpm audit` skips them.
auditConfig:
  ignoreGhsas:
    # zod 3 (< 4.6.6) can exhaust memory on huge collections. Only steiger, a lint tool, still uses
    # zod 3, to validate our own config; zod 3 has no fixed release. Drop when steiger moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.9'
  - '@nestjs/common@12.2.0'
  - '@nestjs/core@12.2.0'
  - '@nestjs/platform-express@12.2.0'
  - '@nestjs/platform-socket.io@12.2.0'
  - '@nestjs/schematics@12.0.9'
  - '@nestjs/testing@12.2.0'
  - '@nestjs/websockets@12.2.0'
  - '@oxlint/binding-android-arm-eabi@1.89.0'
  - '@oxlint/binding-android-arm64@1.89.0'
  - '@oxlint/binding-darwin-arm64@1.89.0'
  - '@oxlint/binding-darwin-x64@1.89.0'
  - '@oxlint/binding-freebsd-x64@1.89.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.89.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.89.0'
  - '@oxlint/binding-linux-arm64-gnu@1.89.0'
  - '@oxlint/binding-linux-arm64-musl@1.89.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.89.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.89.0'
  - '@oxlint/binding-linux-riscv64-musl@1.89.0'
  - '@oxlint/binding-linux-s390x-gnu@1.89.0'
  - '@oxlint/binding-linux-x64-gnu@1.89.0'
  - '@oxlint/binding-linux-x64-musl@1.89.0'
  - '@oxlint/binding-openharmony-arm64@1.89.0'
  - '@oxlint/binding-win32-arm64-msvc@1.89.0'
  - '@oxlint/binding-win32-ia32-msvc@1.89.0'
  - '@oxlint/binding-win32-x64-msvc@1.89.0'
  - oxlint@1.89.0

permissions:
  drizzle-kit:
    build: false
    skills: false
