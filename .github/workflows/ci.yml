name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm lint

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Known advisories that have no fix are listed, with the reason, under auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level moderate
      # An update outside a plugin's peer range installs and lints fine, then breaks silently.
      - run: pnpm peers check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # For drizzle-kit. Tests create their own databases from the .env.example settings.
      DATABASE_URL: postgres://holdem:holdem@127.0.0.1:5433/holdem_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same compose file as local dev, so image tags and the holdem_test init never drift.
      # Containers boot while dependencies install.
      # Docker Hub sometimes answers 502, so pulling is retried before giving up.
      - name: Start Postgres, Redis and Mailpit
        run: |
          for attempt in 1 2 3; do
            docker compose pull --quiet postgres redis mailpit && break
            echo "pull failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          docker compose up -d postgres redis mailpit

      - uses: ./.github/actions/setup
      - run: pnpm build:packages

      - name: Wait for Postgres, Redis and Mailpit
        run: docker compose up -d --wait postgres redis mailpit

      # A schema change committed without its migration makes `generate` write a new one.
      - name: Check that migrations match the schema
        if: hashFiles('apps/api/src/modules/*/infrastructure/persistence/schema.ts') != ''
        run: |
          pnpm db:generate --name schema-drift
          git status --porcelain -- apps/api/migrations | tee /dev/stderr | (! grep -q .)

      - name: Apply migrations
        run: pnpm db:migrate

      # Every package's tests with coverage gates; for the api that includes the e2e suite.
      - name: Test with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The web app validates its configuration on import; the values from apps/web/.env.example.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
